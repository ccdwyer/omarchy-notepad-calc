name: test

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege by default. Only the maintainer-triggered bootstrap job
# below elevates to contents:write, and it never checks out a PR head.
permissions:
  contents: read

jobs:
  node-offline:
    name: engine corpus (node, network off)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Engine corpus (unshare --net)
        run: |
          chmod +x tests/run.js tests/helper.test.sh tests/offline.sh
          if unshare --net --map-root-user true >/dev/null 2>&1; then
            unshare --net --map-root-user bash -c 'ip link set lo up 2>/dev/null || true; node tests/run.js && tests/helper.test.sh'
          else
            sudo unshare --net bash -c 'ip link set lo up 2>/dev/null || true; cd '"$PWD"' && node tests/run.js && tests/helper.test.sh'
          fi

  qml-corpus:
    name: engine corpus (qml, network off)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install qt6-declarative
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qt6-declarative-dev qml6-module-qtquick qml6-module-qtqml qml6-module-qtquick-window \
            qml6-module-qtquick-layouts
      - name: Locate qml binary
        run: |
          QML_BIN=""
          for c in qml6 qml qmlscene; do
            if command -v "$c" >/dev/null 2>&1; then QML_BIN=$(command -v "$c"); break; fi
          done
          if [ -z "$QML_BIN" ]; then
            QML_BIN=$(find /usr -type f \( -name qml6 -o -name qml \) 2>/dev/null | head -n 1 || true)
          fi
          echo "QML_BIN=$QML_BIN"
          echo "QML_BIN=$QML_BIN" >> "$GITHUB_ENV"
          if [ -n "$QML_BIN" ]; then
            echo "PATH=$(dirname "$QML_BIN"):$PATH" >> "$GITHUB_ENV"
          fi
      - name: QML corpus (unshare --net)
        env:
          REQUIRE_QML: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x tests/run-qml.sh
          export QML_BIN
          if unshare --net --map-root-user true >/dev/null 2>&1; then
            unshare --net --map-root-user bash -c "ip link set lo up 2>/dev/null || true; export QML_BIN='$QML_BIN' REQUIRE_QML=1 QT_QPA_PLATFORM=offscreen PATH='$PATH'; tests/run-qml.sh"
          else
            sudo unshare --net bash -c 'ip link set lo up 2>/dev/null || true; cd '"$PWD"' && export QML_BIN='"$QML_BIN"' REQUIRE_QML=1 QT_QPA_PLATFORM=offscreen && tests/run-qml.sh'
          fi

  # Runs on every push and PR with a READ-ONLY token. It never commits.
  # When goldens are absent it generates them and uploads them as an artifact
  # only; when they are present it runs the real pixel-diff gate and fails on
  # divergence. Safe to run untrusted PR code because there is no write token.
  qml-ui-soak-demo:
    name: Panel.qml UI + soak + fresh demo (Linux Qt, network off)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install qt6-declarative, Nix Quickshell, matching QML runtime
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qt6-declarative-dev qml6-module-qtquick qml6-module-qtqml qml6-module-qtquick-window \
            qml6-module-qtquick-layouts qt6-wayland python3
          if ! command -v quickshell >/dev/null 2>&1; then
            curl -L https://nixos.org/nix/install | sh -s -- --no-daemon
            . "$HOME/.nix-profile/etc/profile.d/nix.sh"
            nix --extra-experimental-features 'nix-command flakes' profile install nixpkgs#quickshell
            nix --extra-experimental-features 'nix-command flakes' profile install nixpkgs#kdePackages.qtdeclarative \
              || nix --extra-experimental-features 'nix-command flakes' profile install nixpkgs#qt6.qtdeclarative \
              || true
            command -v quickshell >/dev/null
          fi
      - name: UI grabs, soak, fresh-machine demo (network isolation required)
        env:
          REQUIRE_QML_UI: "1"
          QT_QPA_PLATFORM: offscreen
          NOTEPAD_CALC_UI_ARTIFACT_DIR: /tmp/notepad-calc-ui-captures
        run: |
          if [ -f "$HOME/.nix-profile/etc/profile.d/nix.sh" ]; then
            . "$HOME/.nix-profile/etc/profile.d/nix.sh"
          fi
          chmod +x tests/ui/run.sh tests/ui/demo.sh tests/ui/soak.sh \
            tests/ui/pixeldiff.py tests/ui/setup-qml-env.sh tests/ui/ci-linux.sh
          if unshare --net --map-root-user true >/dev/null 2>&1; then
            unshare --net --map-root-user env \
              HOME="$HOME" USER="${USER:-runner}" PATH="$PATH" \
              REQUIRE_QML_UI=1 QT_QPA_PLATFORM=offscreen \
              NOTEPAD_CALC_UI_ARTIFACT_DIR=/tmp/notepad-calc-ui-captures \
              bash -c "ip link set lo up 2>/dev/null || true; cd \"$PWD\" && tests/ui/ci-linux.sh"
          elif sudo unshare --net true >/dev/null 2>&1; then
            sudo unshare --net env \
              HOME="$HOME" USER="${USER:-runner}" PATH="$PATH" \
              REQUIRE_QML_UI=1 QT_QPA_PLATFORM=offscreen \
              NOTEPAD_CALC_UI_ARTIFACT_DIR=/tmp/notepad-calc-ui-captures \
              bash -c "ip link set lo up 2>/dev/null || true; cd \"$PWD\" && tests/ui/ci-linux.sh"
          else
            echo "FAIL cannot establish network isolation (unshare --net / sudo unshare --net)"
            exit 1
          fi
      - name: Upload UI captures and grabToImage goldens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notepad-calc-ui-captures
          path: |
            tests/goldens/ui/*.png
            /tmp/notepad-calc-ui-captures/*.png
          if-no-files-found: ignore

  # Maintainer-only golden bootstrap. Runs ONLY on a manual workflow_dispatch
  # or a push to the repo's own default branch — never on a pull_request, so a
  # fork PR can never obtain the write token. It checks out a trusted repo
  # branch (github.ref_name), regenerates the 12 Item.grabToImage baselines if
  # they are missing, and commits them.
  bootstrap-ui-goldens:
    name: Bootstrap UI goldens (maintainer only)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Trusted ref only: the dispatched or pushed repo branch. This job
          # never runs for pull_request, so this is never a fork PR head.
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install qt6-declarative, Nix Quickshell, matching QML runtime
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qt6-declarative-dev qml6-module-qtquick qml6-module-qtqml qml6-module-qtquick-window \
            qml6-module-qtquick-layouts qt6-wayland python3
          if ! command -v quickshell >/dev/null 2>&1; then
            curl -L https://nixos.org/nix/install | sh -s -- --no-daemon
            . "$HOME/.nix-profile/etc/profile.d/nix.sh"
            nix --extra-experimental-features 'nix-command flakes' profile install nixpkgs#quickshell
            nix --extra-experimental-features 'nix-command flakes' profile install nixpkgs#kdePackages.qtdeclarative \
              || nix --extra-experimental-features 'nix-command flakes' profile install nixpkgs#qt6.qtdeclarative \
              || true
            command -v quickshell >/dev/null
          fi
      - name: Generate goldens if absent
        env:
          REQUIRE_QML_UI: "1"
          QT_QPA_PLATFORM: offscreen
          NOTEPAD_CALC_UI_ARTIFACT_DIR: /tmp/notepad-calc-ui-captures
        run: |
          if [ -f "$HOME/.nix-profile/etc/profile.d/nix.sh" ]; then
            . "$HOME/.nix-profile/etc/profile.d/nix.sh"
          fi
          chmod +x tests/ui/run.sh tests/ui/demo.sh tests/ui/soak.sh \
            tests/ui/pixeldiff.py tests/ui/setup-qml-env.sh tests/ui/ci-linux.sh
          if unshare --net --map-root-user true >/dev/null 2>&1; then
            unshare --net --map-root-user env \
              HOME="$HOME" USER="${USER:-runner}" PATH="$PATH" \
              REQUIRE_QML_UI=1 QT_QPA_PLATFORM=offscreen \
              NOTEPAD_CALC_UI_ARTIFACT_DIR=/tmp/notepad-calc-ui-captures \
              bash -c "ip link set lo up 2>/dev/null || true; cd \"$PWD\" && tests/ui/ci-linux.sh"
          elif sudo unshare --net true >/dev/null 2>&1; then
            sudo unshare --net env \
              HOME="$HOME" USER="${USER:-runner}" PATH="$PATH" \
              REQUIRE_QML_UI=1 QT_QPA_PLATFORM=offscreen \
              NOTEPAD_CALC_UI_ARTIFACT_DIR=/tmp/notepad-calc-ui-captures \
              bash -c "ip link set lo up 2>/dev/null || true; cd \"$PWD\" && tests/ui/ci-linux.sh"
          else
            echo "FAIL cannot establish network isolation (unshare --net / sudo unshare --net)"
            exit 1
          fi
      - name: Commit bootstrapped UI goldens
        run: |
          set -e
          if ! ls tests/goldens/ui/*.png >/dev/null 2>&1; then
            echo "no grabToImage goldens on disk"
            exit 0
          fi
          git add tests/goldens/ui/*.png
          if git diff --cached --quiet; then
            echo "UI goldens already in git; pixel-diff gate is live"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: bootstrap Linux Item.grabToImage UI goldens"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "UI baselines bootstrapped and pushed to ${GITHUB_REF_NAME}"

  rust-helper:
    name: rust rates helper (cargo test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --manifest-path src/rates-refresh/Cargo.toml
      - name: cargo build --release
        run: cargo build --release --manifest-path src/rates-refresh/Cargo.toml
      - name: Empty-cube XML is rejected
        run: |
          set -e
          XML=$(mktemp)
          OUT=$(mktemp)
          echo '<Cube time="2026-08-18"></Cube>' >"$XML"
          if ./src/rates-refresh/target/release/notepad-calc-rates fetch --xml "$XML" --out "$OUT"; then
            echo "FAIL helper accepted XML with a date and zero currencies"
            exit 1
          fi
          echo "ok  rust helper rejects empty cubes"
