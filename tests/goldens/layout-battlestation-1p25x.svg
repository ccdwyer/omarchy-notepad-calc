<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="623" viewBox="0 0 980 623">
<rect width="100%" height="100%" fill="#1a1b26"/>
<rect x="740" y="0" width="240" height="100%" fill="#16161e"/>
<text x="16" y="53" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5">Omarchy battlestation</text>
<text x="16" y="78" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5"></text>
<text x="16" y="103" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5">planning my Omarchy battlestation — every line is plain text</text>
<text x="16" y="128" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5"></text>
<text x="16" y="153" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5">monitors = 2 × $429</text>
<text x="964" y="153" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#7aa2f7">$858.00</text>
<text x="16" y="178" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5">desk = $349</text>
<text x="964" y="178" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#7aa2f7">$349.00</text>
<text x="16" y="203" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5">chair = $189</text>
<text x="964" y="203" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#7aa2f7">$189.00</text>
<text x="16" y="228" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5">mat = $42</text>
<text x="964" y="228" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#7aa2f7">$42.00</text>
<text x="16" y="253" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5"></text>
<text x="16" y="278" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5">subtotal = monitors + desk + chair + mat</text>
<text x="964" y="278" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#7aa2f7">$1,438.00</text>
<text x="16" y="303" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5">with tax = subtotal + 8.1%</text>
<text x="964" y="303" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#7aa2f7">$1,554.48</text>
<text x="16" y="328" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5">in EUR</text>
<text x="964" y="328" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#7aa2f7">€1,340.07</text>
<text x="16" y="353" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5"></text>
<text x="16" y="378" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5">desk width = 160 cm in inches</text>
<text x="964" y="378" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#7aa2f7">62.992126 in</text>
<text x="16" y="403" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5">SSD copy = 10 GB / 4 MB/s</text>
<text x="964" y="403" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#7aa2f7">41 min 40 s</text>
<text x="16" y="428" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5">arrives = today + 45 days</text>
<text x="964" y="428" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#7aa2f7">Oct 3, 2026</text>
<text x="16" y="453" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5"></text>
<text x="16" y="478" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5">peripherals = $120/mo × 14 months in EUR</text>
<text x="964" y="478" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#7aa2f7">€1,448.28</text>
<text x="16" y="503" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5"></text>
<text x="16" y="528" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5">3pm in Los Angeles → Tokyo time</text>
<text x="964" y="528" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#7aa2f7">7:00 AM tomorrow, JST</text>
<text x="16" y="553" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5"></text>
<text x="16" y="578" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5">hardware = monitors + desk + chair + mat</text>
<text x="964" y="578" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#7aa2f7">$1,438.00</text>
<text x="16" y="603" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#c0caf5">sum</text>
<text x="964" y="603" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#7aa2f7">$1,438.00</text>
