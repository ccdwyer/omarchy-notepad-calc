<text x="16" y="930" font-family="JetBrains Mono, ui-monospace, monospace" font-size="28" fill="#c0caf5">hardware = monitors + desk + chair + mat</text>
<text x="964" y="930" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="28" fill="#7aa2f7">$1,438.00</text>
